url: https://paulesantos.github.io/citesperu/

home:
  title: "citesperu: Listados Oficiales de Fauna y Flora CITES del Perú"
  description: "Datos estructurados, motor de concordancia taxonómica y herramientas reproducibles para consultar especies de fauna y flora silvestres reguladas por CITES en el Perú (MINAM)."

authors:
  Paul E. Santos Andrade:
    href: https://orcid.org/0000-0002-6635-0375
    html: '<a href="https://orcid.org/0000-0002-6635-0375"><img src="https://orcid.org/sites/default/files/images/orcid_16x16.png" alt="ORCID iD" style="vertical-align:middle;margin-right:4px;">Paul E. Santos Andrade</a>'

template:
  bootstrap: 5
  bslib:
    font_scale: 1.0
    base_font:
      - "Plus Jakarta Sans"
      - "system-ui"
      - "-apple-system"
      - "Segoe UI"
      - "Roboto"
      - "sans-serif"
    heading_font:
      - "Lora"
      - "Georgia"
      - "Cambria"
      - "Times New Roman"
      - "serif"
    code_font:
      - "JetBrains Mono"
      - "SFMono-Regular"
      - "Menlo"
      - "Consolas"
      - "monospace"
    bg: "#FCFBF9"
    fg: "#1E1E24"
    primary: "#8B1E22"
    secondary: "#E8D8C8"
    link-color: "#8B1E22"
    info: "#F4ECE1"
    success: "#2D5A27"
    headings-color: "#6B1317"
    navbar-bg: "#FCFBF9"
    navbar-light-color: "#1E1E24"
    navbar-light-hover-color: "#8B1E22"

navbar:
  type: light
  bg: "#FCFBF9"
  structure:
    left:  [home, intro, reference, articles, news]
    right: [search, github]
  components:
    home:
      icon: fa-home
      aria-label: "Inicio"
      href: index.html
    intro:
      text: "Comenzar"
      href: articles/flujo-matching-cites.html
    reference:
      text: "Referencia"
      href: reference/index.html
    articles:
      text: "Guías"
      menu:
        - text: "Flujo de Trabajo y Matching Taxonómico"
          href: articles/flujo-matching-cites.html
    news:
      text: "Novedades"
      href: news/index.html

reference:
  - title: "Motor de Concordancia Taxonómica"
    desc: "Herramientas de evaluación secuencial, resolución de sinónimos oficiales y parsing taxonómico."
    contents:
      - cites_match
      - cites_matching
      - match_cites_pe
      - is_cites
      - is_cites_pe
      - cites_classify_names
      - classify_spnames

  - title: "Listados Oficiales de Fauna CITES (MINAM)"
    desc: "Bases de datos oficiales de especies de fauna silvestre reguladas."
    contents:
      - cites_fauna_peru_2023
      - cites_fauna_peru_2019
      - cites_fauna_peru_2018

  - title: "Listados Oficiales de Flora CITES (MINAM)"
    desc: "Catálogo botánico oficial de especies de flora silvestre reguladas en 9 familias."
    contents:
      - cites_flora_peru_2018

  - title: "Geografía y Biogeografía"
    desc: "Catálogo de acrónimos departamentales de Lamas & Encarnación (1976) y códigos UBIGEO del INEI."
    contents:
      - codigos_departamentos_pe
